#cloud-config
# Base OS provisioning for the promptics persistent Hetzner runner pool.
#
# No secrets in this file — safe to commit and to pass as Hetzner
# `--user-data`. Runner registration (which needs RUNNER_PAT) happens
# afterwards via setup-pool.sh, run over SSH from hetzner-pool-recycle.yml.
#
# Toolchain list copied from promptLM/.github's hetzner-snapshot-bake.yml
# baseline (see docs/decision-log.md D-03) — same languages, same versions,
# so a workflow that runs fine on promptLM's ephemeral runner behaves the
# same way here.

package_update: true
package_upgrade: true

packages:
  - openjdk-17-jdk-headless
  - openjdk-21-jdk-headless
  - maven
  - git
  - curl
  - wget
  - jq
  - unzip
  - tar
  - gzip
  - make
  - ca-certificates
  - shellcheck
  - locales
  - sudo

runcmd:
  # Docker
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker

  # Node 22 LTS
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm install -g pnpm yarn

  # Gradle 8.x (apt's version lags; fetch from gradle.org, same as promptLM's bake)
  - GRADLE_VERSION=8.10 && wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
  - unzip -q /tmp/gradle.zip -d /opt/
  - ln -sf /opt/gradle-8.10/bin/gradle /usr/local/bin/gradle
  - rm /tmp/gradle.zip

  # One dedicated Linux user PER SLOT, not one shared "runner" user.
  #
  # Found the hard way: pnpm/action-setup (and anything else that caches
  # into $HOME, e.g. ~/.cache, ~/.npm) writes to a path keyed only on the
  # user, not the job. Two concurrent jobs on the two different slots
  # both running as the same "runner" user raced on
  # /home/runner/setup-pnpm/node_modules/.bin/store and blew up with
  # ENOTEMPTY mid-install. Two isolated $HOMEs removes the collision
  # entirely instead of hoping nothing else collides next time.
  #
  # Passwordless sudo for both, same reasoning as before: workflows ported
  # from ubuntu-latest routinely `sudo apt-get install` something this
  # image doesn't happen to have; better to let the job self-heal than to
  # pre-empt every GitHub-hosted-image package by hand.
  - |
    for u in runner-a runner-b; do
      useradd -m -s /bin/bash "$u" || true
      usermod -aG docker "$u"
      echo "$u ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/$u"
      chmod 0440 "/etc/sudoers.d/$u"
    done
  # GitHub's hosted runner image ships /usr/local/bin writable by the
  # runner user specifically so "curl a binary, tar -C /usr/local/bin"
  # installer one-liners (gitleaks, and plenty of others) work without a
  # sudo prefix the script never included. Match that for both users via
  # the group they share.
  - groupadd -f runners
  - usermod -aG runners runner-a
  - usermod -aG runners runner-b
  - chown root:runners /usr/local/bin
  - chmod 0775 /usr/local/bin
  - mkdir -p /opt/actions-runner-1 /opt/actions-runner-2
  - chown -R runner-a:runner-a /opt/actions-runner-1
  - chown -R runner-b:runner-b /opt/actions-runner-2

  # Download (not configure) the GitHub Actions runner binary into both
  # slot directories. setup-pool.sh does `./config.sh` + service install
  # once RUNNER_PAT is available — that step needs a secret, this one
  # doesn't.
  - |
    RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
    for pair in "actions-runner-1:runner-a" "actions-runner-2:runner-b"; do
      slot="${pair%%:*}"
      user="${pair##*:}"
      cd /opt/$slot
      curl -fsSL -o runner.tar.gz \
        "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
      tar xzf runner.tar.gz
      rm runner.tar.gz
      chown -R "$user:$user" /opt/$slot
    done

  # Verify toolchain
  - docker --version
  - java -version
  - mvn -v
  - gradle -v
  - node --version

  # Signal readiness for the recycle workflow's SSH-wait loop
  - touch /opt/cloud-init-done
